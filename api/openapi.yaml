openapi: 3.0.3
info:
  title: Writing Assistant Engine API
  description: >
    The academic writing-assistant engine's REST/SSE surface (ADR-0017). Typed
    non-streaming routes are codegen'd with ogen; the `/turn` SSE stream is
    hand-framed in the API server (ADR-0031) and is marked x-ogen-raw-response so
    ogen hands the handler the raw http.ResponseWriter.
  version: 0.1.0

servers:
  - url: http://127.0.0.1:9100

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /models:
    get:
      operationId: listModels
      summary: Discover the servable fleet (ADR-0018)
      description: Deprecated for clients — use /fleet (ADR-0040). Retained for compatibility.
      responses:
        '200':
          description: model list + live state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'

  /fleet:
    get:
      operationId: getFleet
      summary: Serving observability — models + live state + control-plane reachability (ADR-0040)
      description: >
        The observability surface the model selectors consume. Answers 200 even
        when the control daemon is unreachable: `control` drops to
        "unreachable" and `models` carries the last-known projection with every
        liveState forced to "unknown" (ADR-0040 §3).
      responses:
        '200':
          description: fleet state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetState'

  /models/{name}/start:
    post:
      operationId: startModel
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: started (up)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStateResponse'

  /models/{name}/stop:
    post:
      operationId: stopModel
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: stopped (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStateResponse'

  /models/{name}/provision:
    post:
      operationId: provisionModel
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '202':
          description: accepted (async download)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'

  /models/{name}/status:
    get:
      operationId: getModelStatus
      parameters:
        - $ref: '#/components/parameters/Name'
      responses:
        '200':
          description: live state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveStateResponse'

  /modes:
    get:
      operationId: listModes
      responses:
        '200':
          description: modes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mode'

  /tools:
    get:
      operationId: listTools
      responses:
        '200':
          description: tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolDef'

  /directories:
    get:
      operationId: listDirectory
      summary: List one directory's direct, non-recursive entries (ADR-0035)
      description: >
        Bounded by ALLOWED_ROOTS (ADR-0049 §6): a path outside the allowlist is
        refused with the typed `path-outside-allowed-roots` error, never
        silently.
      parameters:
        - name: path
          in: query
          required: true
          description: absolute path of the directory to list
          schema:
            type: string
      responses:
        '200':
          description: the directory's entries (shallow, name-sorted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '403':
          description: the path lies outside ALLOWED_ROOTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathOutsideAllowedRoots'

  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List the workspace registry (ADR-0049 §2)
      responses:
        '200':
          description: workspaces, newest-created first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
    post:
      operationId: createWorkspace
      summary: Create-or-resume a workspace by absolute root (ADR-0049 §2)
      description: >
        Canonicalizes the root (EvalSymlinks + case-fold): an alias or an
        already-open nested directory resumes the most specific existing
        workspace; otherwise a workspace is created and seeded with the root as
        its first corpus root and `**/*.md` as the default include.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '200':
          description: created-or-resumed workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      summary: Read one workspace record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'

  /corpus:
    get:
      operationId: getCorpus
      summary: Read a workspace's corpus scope, per-document status, and job progress (ADR-0049 §4)
      parameters:
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: corpus state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusState'
    put:
      operationId: putCorpus
      summary: Set a workspace's corpus scope; idempotent, index-only (ADR-0049 §3/§4)
      description: >
        Roots are canonicalized and deduped; include/exclude globs decide
        retrievability (default `**/*.md`, hidden directories excluded). The
        scope change reconciles the index asynchronously; no document file is
        ever created, modified, or deleted. A root outside ALLOWED_ROOTS is
        refused with the typed `path-outside-allowed-roots`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCorpusRequest'
      responses:
        '200':
          description: the reconciled scope (job running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusState'
        '403':
          description: a root lies outside ALLOWED_ROOTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathOutsideAllowedRoots'

  /corpus/index:
    post:
      operationId: indexCorpus
      summary: Bulk (re)index the current scope; async, idempotent per unchanged content (ADR-0049 §4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusIndexRequest'
      responses:
        '202':
          description: accepted; poll GET /corpus for progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusJob'

  /corpus/documents/{id}:
    delete:
      operationId: evictCorpusDocument
      summary: Evict one corpus document from retrieval; idempotent (ADR-0049 §4)
      description: >
        Removes the file's chunks from both the vector and full-text indexes and
        records an eviction tombstone (status `evicted` until re-indexed). No
        file on disk is touched. Deleting twice succeeds.
      parameters:
        - name: id
          in: path
          required: true
          description: stable path-derived corpus document id (sha256 prefix)
          schema:
            type: string
        - name: workspaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: evicted (idempotent)
        '403':
          description: the document path lies outside ALLOWED_ROOTS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathOutsideAllowedRoots'

  /documents:
    post:
      operationId: openDocument
      summary: Open/create a document by path; returns its surrogate id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenDocumentRequest'
      responses:
        '200':
          description: document id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

  /documents/{id}/blocks:
    get:
      operationId: getBlocks
      parameters:
        - $ref: '#/components/parameters/DocumentID'
      responses:
        '200':
          description: block tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'

  /documents/{id}/edits:
    post:
      operationId: applyEdit
      parameters:
        - $ref: '#/components/parameters/DocumentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockEdit'
      responses:
        '200':
          description: revision (candidate staged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'

  /documents/{id}/commits:
    post:
      operationId: commitDocument
      summary: Accept staged candidates (one commit, write-through)
      description: >
        Accepts the staged candidates (newest-first, deterministic), re-validates
        each candidate's base content hash, formats, makes one git commit with an
        auto-derived message (`mode · blockID · diff`), and mirrors the canonical
        markdown back to the opened file (ADR-0047 §1/§5/§8). An empty accept
        creates no commit. If the file on disk changed since the engine last read
        it, the write-through is refused with `file-changed-externally` unless
        `overwrite` is true — never a silent clobber.
      parameters:
        - $ref: '#/components/parameters/DocumentID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
      responses:
        '200':
          description: committed (revision populated; write-through reported)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '409':
          description: >
            The file at `documents.path` changed externally since the engine last
            read it; no bytes were written. Reload the document or retry with
            `overwrite: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileChangedExternally'

  /documents/{id}/tree:
    put:
      operationId: saveDocument
      summary: Replace the document's block tree (manual autosave, ADR-0038)
      description: >
        The manual-edit wire path (ADR-0038): the client's whole block-tree
        snapshot. Array order = position; a block with no `id` is new (the engine
        mints a UUID, ADR-0020 §3); an `id` present in the current tree but absent
        from the request is deleted; a changed `kind`/`parentId` is retyped/moved.
        The engine reconciles, normalizes on write and formats on commit, and
        commits `autosave @ <ts>` iff anything changed (a no-op returns the current
        HEAD). A manual save of a block drops its open candidates. When
        `writeThrough` is true (explicit Save / Cmd+S, not the periodic autosave),
        the engine also mirrors the canonical markdown back to the opened file
        path (ADR-0039). Per ADR-0047 §4 a no-op save still re-syncs a stale disk
        (no new commit), and an external change surfaces as a
        `file-changed-externally` conflict — never a silent clobber.
      parameters:
        - $ref: '#/components/parameters/DocumentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTreeRequest'
      responses:
        '200':
          description: resulting revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        '409':
          description: >
            The file at `documents.path` changed externally since the engine last
            read it; no bytes were written. Reload the document or retry with
            `overwrite: true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileChangedExternally'

  /documents/{id}/history:
    get:
      operationId: getHistory
      parameters:
        - $ref: '#/components/parameters/DocumentID'
      responses:
        '200':
          description: revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Revision'

  /documents/{id}/diff:
    get:
      operationId: getDiff
      parameters:
        - $ref: '#/components/parameters/DocumentID'
        - name: base
          in: query
          required: true
          schema:
            type: string
        - name: rev
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: word edits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WordEdit'

  /documents/{id}/blocks/{bid}/candidates:
    get:
      operationId: getCandidates
      parameters:
        - $ref: '#/components/parameters/DocumentID'
        - $ref: '#/components/parameters/BlockID'
      responses:
        '200':
          description: open candidates for one block
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'

  /turn:
    post:
      operationId: startTurn
      summary: Run one agent turn (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '200':
          description: >
            SSE event stream. Each message is `event: <type>` followed by
            `data: <payload>` where <type> is one of the Event.type enum values
            and <payload> is the matching component schema (TokenEvent,
            MeterEvent, CandidateEvent, DiffEvent, RagEvent, ContextEvent,
            LocateEvent, DoneEvent, ErrorEvent, BackpressureEvent). One turn per
            connection: the server
            demultiplexes a turn's events to exactly one client stream, so
            payloads do not repeat the turnId. (ADR-0017 §6, amended.)
          content:
            text/event-stream:
              x-ogen-raw-response: true
              schema:
                $ref: '#/components/schemas/Event'

  /sessions:
    get:
      operationId: listSessions
      summary: Workspace-scoped session list (ADR-0049)
      description: >
        Lists sessions newest-first. At least one of `workspaceId` or
        `documentId` is required: `workspaceId` selects the workspace shard
        directly; `documentId` resolves the workspace that contains the
        document (fallback). Both filters may be combined.
      parameters:
        - name: workspaceId
          in: query
          required: false
          schema:
            type: string
        - name: documentId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: sessions for a workspace (optionally filtered by document)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
    post:
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '200':
          description: created-or-resumed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /sessions/{id}/messages:
    get:
      operationId: getSessionMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

  /sessions/{id}/context:
    put:
      operationId: putSessionContext
      summary: Persist a session's context policy (ADR-0049 §8)
      description: >
        Replaces the session's persisted context policy (pins, excludes,
        auto-RAG flag, retrieval query) and returns the session so the client
        reads back what was persisted. The policy carries the same shape as the
        per-turn `Task.context` override; it survives turns, reconnects, and
        session resume. Per-turn overrides are never persisted. An unknown
        session is the typed 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextPolicy'
      responses:
        '200':
          description: the session with its persisted policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: no session exists with the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'

  /turns/{id}/context:
    get:
      operationId: getTurnContext
      summary: Read a completed turn's persisted context snapshot (ADR-0044 §4)
      description: >
        Returns the context snapshot the engine persisted for a turn: every
        assembled message with its component and provenance, the retrieved
        chunks, the labeled drops, and the budget accounting. The snapshot is
        engine data; clients render it and never reconstruct it. The turn id is
        resolved to its workspace shard through the registry's turn routing
        index; an unknown turn is a typed 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the turn's context snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextSnapshot'
        '404':
          description: no snapshot exists for the turn id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'

  /turns/{id}/locate:
    post:
      operationId: resolveLocate
      summary: Answer a waiting turn's `/locate` ambiguity picker (ADR-0048 §4)
      description: >
        When a `/locate` turn resolves to a fuzzy match it emits a `locate` event
        with ranked candidates and waits (bounded) for the user's choice. This
        route resumes the turn: pick a candidate by its `chunkKey`, or cancel to
        degrade the turn to plain chat. No model call and no edit happen before
        the choice. An unknown turn id is a typed 404; a turn that is not waiting
        on a picker (already answered, timed out, or never ambiguous) is a typed
        409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocateChoice'
      responses:
        '204':
          description: the choice was delivered to the waiting turn
        '404':
          description: no turn exists with the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: the turn is not waiting on a locate picker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoPendingLocate'

  /sessions/{id}/meter:
    get:
      operationId: getSessionMeter
      summary: Read a session's cumulative per-component token meter (ADR-0026, ADR-0044)
      description: >
        Aggregates the workspace shard's meter_events for a session by
        component (system, tools, rag, history, mentions, user, thinking,
        completion) and returns the cumulative total. The session id is
        resolved to its workspace shard through the registry's session routing
        index; an unknown session is a typed 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: the session's cumulative meter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionMeter'
        '404':
          description: no session exists with the id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'

components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    DocumentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    BlockID:
      name: bid
      in: path
      required: true
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        baseUrl:
          type: string
          description: >
            The engine's actual bound base URL (http://host:port). Populated so a
            dynamic-port client (ADR-0021 §1) can discover the engine rather than
            assume a port. In fixed mode this equals the configured address; in
            dynamic mode it is the OS-assigned port. Recorded amendment to
            ADR-0017 §4.

    Capabilities:
      type: object
      required: [contextLength, thinkingMode, supportsSystemPrompt]
      properties:
        contextLength:
          type: integer
        thinkingMode:
          type: boolean
        supportsSystemPrompt:
          type: boolean

    SamplingParams:
      type: object
      properties:
        temperature:
          type: number
        maxTokens:
          type: integer

    Model:
      type: object
      required: [name, baseUrl]
      properties:
        name:
          type: string
        baseUrl:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        modeTags:
          type: array
          items:
            type: string
        liveState:
          type: string
          enum: [up, down, starting, stopping, provisioning, unknown]

    LiveStateResponse:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [up, down, starting, stopping, provisioning, unknown]

    FleetState:
      type: object
      required: [control, models]
      properties:
        control:
          type: string
          enum: [up, unreachable]
        models:
          type: array
          items:
            $ref: '#/components/schemas/FleetModel'

    FleetModel:
      type: object
      required: [name, baseUrl, liveState]
      properties:
        name:
          type: string
        baseUrl:
          type: string
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        modeTags:
          type: array
          items:
            type: string
        liveState:
          type: string
          enum: [up, down, starting, stopping, provisioning, unknown]

    ProvisionResponse:
      type: object
      required: [provisionID]
      properties:
        provisionID:
          type: string

    Mode:
      type: object
      required: [name, systemPrompt, defaultModel]
      properties:
        name:
          type: string
        systemPrompt:
          type: string
        defaultModel:
          type: string

    ToolDef:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object

    OpenDocumentRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string

    Document:
      type: object
      required: [id, path, rootBlockId]
      properties:
        id:
          type: string
        path:
          type: string
          description: The canonical (symlink-resolved) absolute path the engine keys the document by (ADR-0047 §2).
        rootBlockId:
          type: string
        updatedAt:
          type: integer
          format: int64
        externalChange:
          type: boolean
          description: >
            True when the file changed on disk since the engine last read it and
            was re-read into the worktree on this open (ADR-0047 §2). Aliases of
            the same file resolve to one document row.

    Entry:
      type: object
      description: One directory entry (ADR-0035). Hidden entries are returned; display filtering is client-side.
      required: [name, path, isDir]
      properties:
        name:
          type: string
        path:
          type: string
        isDir:
          type: boolean

    DirectoryListing:
      type: object
      description: A shallow, non-recursive directory listing (ADR-0035 §2).
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/Entry'

    Workspace:
      type: object
      description: >
        A persistent engine entity: a root directory plus its subdirectories,
        governing browsing and editing only (ADR-0049 §1/§2). Workspace ≠
        Corpus: the corpus is a separate, multi-root retrievability scope.
      required: [id, root, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        root:
          type: string
          description: canonical absolute directory (EvalSymlinks + case-fold)
        name:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    CreateWorkspaceRequest:
      type: object
      required: [root]
      properties:
        root:
          type: string
          description: absolute directory to open (canonicalized)
        name:
          type: string
          description: optional display label (default basename of root)

    CorpusState:
      type: object
      description: A workspace's corpus scope, per-document status, and job progress (ADR-0049 §4/§16).
      required: [workspaceId, roots, include, exclude, documents]
      properties:
        workspaceId:
          type: string
        roots:
          type: array
          items:
            type: string
        include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CorpusDocument'
        job:
          $ref: '#/components/schemas/CorpusJob'

    CorpusDocument:
      type: object
      description: >
        One corpus file's index status. Corpus files are never documents rows
        and never versioned (ADR-0049 §4); `id` is the stable path-derived
        identity (sha256 prefix of the canonical path).
      required: [id, path, status]
      properties:
        id:
          type: string
        path:
          type: string
        status:
          type: string
          enum: [indexed, stale, pending, evicted, error]
        chunkCount:
          type: integer
        indexedAt:
          type: integer
          format: int64
        error:
          type: string

    CorpusJob:
      type: object
      description: One observable corpus indexing job; progress is polled via GET /corpus (Phase C pin).
      required: [id, workspaceId, kind, state, total, completed]
      properties:
        id:
          type: string
        workspaceId:
          type: string
        kind:
          type: string
          enum: [reconcile, index, path]
        state:
          type: string
          enum: [running, done, error]
        total:
          type: integer
        completed:
          type: integer
        error:
          type: string
        startedAt:
          type: integer
          format: int64
        finishedAt:
          type: integer
          format: int64

    PutCorpusRequest:
      type: object
      description: Set a workspace's corpus scope (idempotent; reconciles the index).
      required: [workspaceId]
      properties:
        workspaceId:
          type: string
        roots:
          type: array
          items:
            type: string
          description: canonicalized and deduped; empty = the workspace root
        include:
          type: array
          items:
            type: string
          description: include globs; empty = **/*.md
        exclude:
          type: array
          items:
            type: string

    CorpusIndexRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId:
          type: string

    PathOutsideAllowedRoots:
      type: object
      description: >
        A path outside the ALLOWED_ROOTS allowlist was refused (ADR-0049 §6).
        Never silent; the refusal holds even at ENGINE_BIND=0.0.0.0.
      required: [error, path, allowedRoots]
      properties:
        error:
          type: string
          enum: [path-outside-allowed-roots]
        path:
          type: string
        allowedRoots:
          type: array
          items:
            type: string

    Block:
      type: object
      required: [id, kind, position, text]
      properties:
        id:
          type: string
        parentId:
          type: string
        kind:
          type: string
          enum: [paragraph, heading, list_item, code_fence, blockquote, table]
        position:
          type: integer
        text:
          type: string
        hash:
          type: string

    Guard:
      type: object
      required: [blockId, hash]
      properties:
        blockId:
          type: string
        hash:
          type: string

    BlockEdit:
      type: object
      required: [blockId, text]
      properties:
        blockId:
          type: string
        text:
          type: string
        guards:
          type: array
          items:
            $ref: '#/components/schemas/Guard'

    SaveTreeRequest:
      type: object
      description: The manual-edit whole-tree snapshot (ADR-0038). Array order = position.
      required: [blocks]
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockWrite'
        writeThrough:
          type: boolean
          description: >
            When true (explicit Save / Cmd+S, not the periodic autosave), the
            engine also mirrors the canonical markdown back to the opened file
            path (ADR-0039). Default false — the autosave only snapshots the
            engine worktree + git.
        overwrite:
          type: boolean
          description: >
            Explicit opt-in to overwrite an externally changed file (ADR-0047
            §3). Default false: a mismatch is refused with
            `file-changed-externally` (409).

    BlockWrite:
      type: object
      description: >
        One block in a manual tree save. `id` absent = new block (engine mints a
        UUID, ADR-0020 §3); `id` present = existing block matched by stable UUID.
        No `hash`/`guards` — those are AI-edit concerns (ADR-0029 §4).
      required: [kind, text]
      properties:
        id:
          type: string
        parentId:
          type: string
        kind:
          type: string
          enum: [paragraph, heading, list_item, code_fence, blockquote, table]
        text:
          type: string

    Revision:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        timestamp:
          type: integer
          format: int64
        writtenThrough:
          type: boolean
          description: >
            True when the canonical markdown was mirrored to the opened file
            during this write boundary (ADR-0047 §8). False on an empty accept /
            engine-only autosave.
        path:
          type: string
          description: The file path that was mirrored when `writtenThrough` is true.

    CommitRequest:
      type: object
      description: Optional accept options for `commitDocument` (ADR-0047 §3).
      properties:
        overwrite:
          type: boolean
          description: >
            Explicit opt-in to overwrite an externally changed file. Default
            false: a mismatch is refused with `file-changed-externally` (409).

    FileChangedExternally:
      type: object
      description: >
        The file at `documents.path` changed externally since the engine last
        read it; the write-through was refused and no bytes were written
        (ADR-0047 §3). `currentHash` is the current on-disk content hash so the
        client can show or compare it; retry with `overwrite: true` to accept it.
      required: [error, path, currentHash]
      properties:
        error:
          type: string
          enum: [file-changed-externally]
        path:
          type: string
        currentHash:
          type: string

    WordEdit:
      type: object
      required: [blockId]
      properties:
        blockId:
          type: string
        insertions:
          type: array
          items:
            type: string
        deletions:
          type: array
          items:
            type: string

    Candidate:
      type: object
      properties:
        blockId:
          type: string
        text:
          type: string
        baseId:
          type: string

    Selection:
      type: object
      properties:
        blockId:
          type: string

    TurnOptions:
      type: object
      properties:
        temperature:
          type: number
        model:
          type: string

    Mention:
      type: object
      description: A turn-scoped file attachment (ADR-0036); absolute path resolved by the client.
      required: [path]
      properties:
        path:
          type: string

    Task:
      type: object
      required: [sessionId, modeName, documentId, userInput]
      properties:
        sessionId:
          type: string
        modeName:
          type: string
        documentId:
          type: string
        workspaceId:
          type: string
          description: >
            The workspace whose shard owns this turn's sessions/meter/index
            (ADR-0049 §5). Optional: when absent the engine resolves-or-creates
            a workspace rooted at the canonical parent directory of the turn's
            document (keeps pre-workspace clients working).
        userInput:
          type: string
        selection:
          $ref: '#/components/schemas/Selection'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Mention'
        options:
          $ref: '#/components/schemas/TurnOptions'
        context:
          $ref: '#/components/schemas/ContextPolicy'

    Message:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant, tool]
        content:
          type: string
        timestamp:
          type: integer
          format: int64

    Session:
      type: object
      required: [id, documentId]
      properties:
        id:
          type: string
        documentId:
          type: string
        workspaceId:
          type: string
          description: >
            The workspace whose shard owns this session (ADR-0049 §5). Optional
            on the wire for backward compatibility; always populated by the
            engine on responses.
        anchorBlockId:
          type: string
        modeType:
          type: string
        title:
          type: string
        tokenBudget:
          type: integer
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        contextPolicy:
          $ref: '#/components/schemas/ContextPolicy'

    CreateSessionRequest:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: string
        workspaceId:
          type: string
          description: >
            The workspace shard that owns the new session (ADR-0049 §5).
            Optional: when absent the engine resolves-or-creates a workspace
            rooted at the canonical parent directory of the document.
        anchorBlockId:
          type: string
        modeType:
          type: string

    SessionMeter:
      type: object
      description: >
        A session's cumulative token meter, aggregated from the workspace
        shard's meter_events by component (ADR-0026 §5, ADR-0044 §4). Newest
        session state is workspace-scoped; there is no global meter total
        (ADR-0049 §5).
      required: [sessionId, components, total]
      properties:
        sessionId:
          type: string
        components:
          type: array
          items:
            type: object
            required: [component, promptTokens, completionTokens]
            properties:
              component:
                type: string
                enum: [system, tools, rag, history, mentions, user, thinking, completion, compaction]
              promptTokens:
                type: integer
              completionTokens:
                type: integer
              approx:
                type: boolean
                description: True when the component is a labeled approximation (thinking, ADR-0024).
        total:
          type: integer
          description: Cumulative prompt + completion tokens across all components.

    NotFound:
      type: object
      description: >
        A typed not-found refusal for a routing lookup that resolved to no
        record (an unknown turn or session id). The engine never invents data.
      required: [error, resource, id]
      properties:
        error:
          type: string
          enum: [not-found]
        resource:
          type: string
          enum: [turn, session]
        id:
          type: string

    NoPendingLocate:
      type: object
      description: >
        The typed refusal when POST /turns/{id}/locate answers a turn that is
        not waiting on a locate picker (already answered, timed out, or never
        ambiguous).
      required: [error, turnId]
      properties:
        error:
          type: string
          enum: [no-pending-locate]
        turnId:
          type: string

    LocateChoice:
      type: object
      description: >
        The ambiguity picker's answer (ADR-0048 §4): pick a candidate by its
        `chunkKey`, or cancel to degrade the turn to plain chat.
      properties:
        chunkKey:
          type: string
        cancel:
          type: boolean

    LocateCandidate:
      type: object
      description: >
        One ranked `/locate` anchor candidate in an ambiguous result (ADR-0048
        §4). `chunkKey` is the picker's choice key (the block id for an
        open-document block, else the indexed chunk key).
      required: [path, chunkKey, score, textPreview]
      properties:
        documentId:
          type: string
        path:
          type: string
        blockId:
          type: string
        chunkKey:
          type: string
        score:
          type: number
        textPreview:
          type: string
        stale:
          type: boolean

    LocateResult:
      type: object
      description: >
        The deterministic `/locate` chunk-anchoring outcome (ADR-0048 §3),
        recorded in the turn's context snapshot, emitted as the `locate` SSE
        event, and returned by the picker route. `status` is resolved |
        ambiguous | not-found; `matchType` is exact | fuzzy. Fuzzy matches always
        require confirmation, so a fuzzy outcome is `ambiguous` even with one
        candidate.
      required: [status]
      properties:
        turnId:
          type: string
          description: >
            Populated only on the emitted `locate` SSE event so a client can
            answer the ambiguity picker via POST /turns/{id}/locate; absent from
            the snapshot record (the snapshot envelope already carries turnId).
        status:
          type: string
          enum: [resolved, ambiguous, not-found]
        matchType:
          type: string
          enum: [exact, fuzzy]
        confidence:
          type: number
        documentId:
          type: string
        path:
          type: string
        blockId:
          type: string
        chunkKey:
          type: string
        span:
          type: array
          items:
            type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/LocateCandidate'
        stale:
          type: boolean
        context:
          type: string

    # SSE event vocabulary (ADR-0017 §6, amended Track 1 TUI session). The
    # hand-framed server writes `event: <type>` + `data: <payload>`; the client
    # codegens (Hey API + Zod, openapi-to-rust) consume the payload schemas
    # below as typed SSE decoders keyed by the SSE event name. turnId
    # correlation is per-connection (one turn per stream) and is not repeated
    # in payloads.
    Event:
      type: object
      description: >
        Framing marker for the SSE stream: the `event:` line carries `type`;
        the `data:` line carries the payload schema matching that type. The
        payload JSON itself has no `type` field.
      required: [type]
      properties:
        type:
          type: string
          enum: [token, meter, candidate, diff, rag, context, locate, thinking, done, error, backpressure]

    TokenEvent:
      type: object
      required: [text]
      properties:
        text:
          type: string

    ThinkingEvent:
      type: object
      description: >
        A raw reasoning/thinking delta forwarded live from the provider so a
        client can render a thinking indicator instead of an unexplained pause
        (ADR-0051 §4). The exact thinking count is reconciled by the meter; this
        event is progress only. Payload granularity is a text delta.
      required: [text]
      properties:
        text:
          type: string

    MeterEvent:
      type: object
      description: >
        One attributed token breakdown per turn (interface.md §6). Components
        sum to the scaled provider totals; `thinkingApprox` labels an
        approximated thinking count (ADR-0024); `mentions` carries the turn's
        file-mention tokens (ADR-0036 §5).
      required: [system, tools, rag, history, mentions, user, thinking, completion]
      properties:
        system:
          type: integer
        tools:
          type: integer
        rag:
          type: integer
        history:
          type: integer
        mentions:
          type: integer
        user:
          type: integer
        thinking:
          type: integer
        thinkingApprox:
          type: boolean
        completion:
          type: integer
        measurement:
          $ref: '#/components/schemas/TurnMeasurement'

    CandidateEvent:
      type: object
      description: The edit_markdown structured result (ADR-0029 §5).
      required: [ok]
      properties:
        ok:
          type: boolean
        blockId:
          type: string
        error:
          type: string
          enum: [guard-failed, invalid-structure, invalid-args]
        revision:
          $ref: '#/components/schemas/Revision'
        issues:
          type: array
          items:
            type: string

    DiffEvent:
      type: object
      description: >
        A word-level diff payload: either the diff tool's structured result
        (`{ok, edits}`) or raw WordEdit-shaped fields from an observed edit.
      properties:
        ok:
          type: boolean
        blockId:
          type: string
        insertions:
          type: array
          items:
            type: string
        deletions:
          type: array
          items:
            type: string
        edits:
          type: array
          items:
            $ref: '#/components/schemas/WordEdit'

    RagEvent:
      type: object
      description: >
        The retrieve/read_note/auto-RAG structured result surfacing retrieval to
        the UI. Chunks carry provenance: `chunkKey` (path#index for corpus
        files, documentID#index for versioned documents), `path`, `heading`,
        and `source` (the citation marker) (ADR-0044 §3, ADR-0049 §4).
      required: [ok]
      properties:
        ok:
          type: boolean
        chunks:
          type: array
          items:
            type: object
            required: [blockId, text]
            properties:
              blockId:
                type: string
              chunkKey:
                type: string
              text:
                type: string
              score:
                type: number
              source:
                type: string
              path:
                type: string
              heading:
                type: string

    ChunkRef:
      type: object
      description: >
        A stable reference to one indexed chunk, used by the context tray for
        pin/exclude decisions (ADR-0049 §8). `chunkKey` is path#index for
        corpus files and documentID#index for versioned documents; `path` is
        the canonical absolute file path. When `chunkKey` is omitted the ref
        names every chunk under `path`; `hash` optionally pins the chunk's
        content hash so a stale pin is detectable (advisory in Phase C4).
      required: [path]
      properties:
        path:
          type: string
        chunkKey:
          type: string
        hash:
          type: string

    ContextPolicy:
      type: object
      description: >
        A session-level context policy (persisted) or a per-turn override
        (`Task.context`). All fields are optional. Merge is replace-when-present
        per field: a present field replaces the lower layer wholesale (an
        explicit empty `pinned`/`excluded` list clears that field), while an
        absent field inherits it. Pins are human overrides that bypass the
        decision gate (Phase F) but never budgets; auto-retrieved chunks remain
        gated. The client sends decisions, never payload text.
      properties:
        pinned:
          type: array
          items:
            $ref: '#/components/schemas/ChunkRef'
          description: >
            Chunks to include as human-pinned overrides, front-loaded
            deterministically and resolved through the index (works even when
            not in the retrieval top-k).
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/ChunkRef'
          description: >
            Retrieved chunks to drop from the payload, matched by `chunkKey`
            (or by canonical `path` when only a path is given); each removal is
            recorded as a labeled drop.
        autoRag:
          type: boolean
          description: >
            Whether auto-RAG retrieval runs. When absent the persisted session
            policy (or the default, true) applies. When false, retrieval is
            skipped but pins still apply.
        retrievalQuery:
          type: string
          description: >
            The query auto-RAG runs. When absent the persisted session policy,
            else `Task.userInput`, applies. Affects retrieval only, never the
            user message.
        thinking:
          type: string
          enum: [off, auto, on]
          description: >
            The turn's thinking policy (ADR-0051 §1). When absent the persisted
            session policy, else the pipeline default, applies. `off` asks the
            runner to disable its thinking channel; `auto` runs thinking-off and
            escalates once after a structured failure; `on` always thinks. Never
            a preset field (ADR-0045).

    ContextSnapshot:
      type: object
      description: >
        The engine-owned, persisted record of one turn's assembled context
        (ADR-0044 §4, ADR-0049 §7): every assembled message with its component
        and provenance, the retrieved chunks, the labeled drops, and the budget
        accounting. The snapshot itself is the contract — clients render it and
        never reconstruct provenance, budgets, or drops. The optional
        `decision` (Phase F) and `locate` (Phase D) records are reserved and
        not implemented in Phase C3.
      required: [turnId, sessionId, workspaceId, retrievalQuery, autoRag, messages, chunks, drops, budget, createdAt]
      properties:
        turnId:
          type: string
        sessionId:
          type: string
        workspaceId:
          type: string
        retrievalQuery:
          type: string
          description: The query auto-RAG ran (the turn's user input).
        autoRag:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ContextMessage'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ContextChunk'
        drops:
          type: array
          items:
            $ref: '#/components/schemas/ContextDrop'
        budget:
          type: array
          items:
            $ref: '#/components/schemas/BudgetUsage'
        decision:
          type: object
          description: Reserved for Phase F decision records; not implemented in Phase C3.
        locate:
          $ref: '#/components/schemas/LocateResult'
        thinking:
          $ref: '#/components/schemas/ThinkingSnapshot'
        measurements:
          $ref: '#/components/schemas/TurnMeasurement'
        compacted:
          $ref: '#/components/schemas/CompactionRecord'
        window:
          $ref: '#/components/schemas/WindowUsage'
        sessionBudget:
          $ref: '#/components/schemas/SessionBudget'
        createdAt:
          type: integer
          format: int64

    SessionBudget:
      type: object
      description: >
        The session budget state for one turn (ADR-0051 §7). `soft` labels the
        warning (the turn proceeds); `hard` labels the refusal (unless
        compaction rescued the turn).
      properties:
        soft:
          type: boolean
        hard:
          type: boolean
        used:
          type: integer
        budget:
          type: integer

    ThinkingSnapshot:
      type: object
      description: >
        The turn's resolved thinking outcome (ADR-0051 §1–§5): the policy level,
        the level actually used, and the labeled degradation/escalation/
        truncation outcome. Every field is engine-owned; clients render it.
      required: [level, effective]
      properties:
        level:
          type: string
          enum: [off, auto, on]
          description: The resolved policy level (pipeline default ← session ← per-turn).
        effective:
          type: boolean
          description: True when the provider request actually enabled the thinking channel.
        escalated:
          type: boolean
          description: True when `auto` retried once with thinking-on after a structured failure.
        escalationReason:
          type: string
          description: >
            The structured failure that triggered the escalation
            (`invalid-structure` | `guard-failed` | `no-outcome`).
        unsupported:
          type: boolean
          description: True when the resolved runner cannot disable thinking; labeled `thinking-unsupported`.
        truncated:
          type: boolean
          description: True when the thinking budget was reached before a tool call or answer; labeled `thinking-truncated`.

    TurnMeasurement:
      type: object
      description: >
        Per-turn measurements (ADR-0051 §11): the token counts, wall-clock
        latency, model + quant, and window utilization recorded per model so the
        hardware map accumulates. No measurement is approximated without a label
        (the thinking count carries `thinkingApprox` on the meter).
      properties:
        promptTokens:
          type: integer
        thinkingTokens:
          type: integer
        completionTokens:
          type: integer
        latencyMs:
          type: integer
          format: int64
        model:
          type: string
        quant:
          type: string
        windowUtilization:
          type: number
          description: promptTokens / model.capabilities.contextLength (0 when unknown).

    CompactionRecord:
      type: object
      description: >
        The summarized history range replaced by one metered summary message
        (ADR-0051 §8). Pins and the most recent turns survive; the prefix-cache
        reuse traded away is labeled, not silent.
      properties:
        fromTs:
          type: integer
          format: int64
        toTs:
          type: integer
          format: int64
        turns:
          type: integer
        summaryTokens:
          type: integer
        cacheCost:
          type: boolean
          description: True when compaction (or a tray edit) changed the front-loaded prefix, trading away cache reuse.

    WindowUsage:
      type: object
      description: >
        The per-turn context-window accounting (ADR-0051 §6): the assembled
        payload plus output reserve against the model's context window.
      properties:
        contextLength:
          type: integer
        used:
          type: integer
        reserve:
          type: integer
        utilization:
          type: number

    ContextMessage:
      type: object
      description: >
        One assembled message's component and provenance. `tool`/`thinking` are
        components but not messages, so they appear in the budget accounting.
      required: [role, component, tokens, pinned]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        component:
          type: string
          enum: [system, history, rag, mention, user]
        source:
          type: string
        tokens:
          type: integer
        pinned:
          type: boolean
          description: True for a human-pinned item (Phase C4); false in Phase C3.

    ContextChunk:
      type: object
      description: >
        One retrieved chunk recorded in the snapshot; the same shape as a
        RagEvent chunk, with provenance (ADR-0044 §3).
      required: [blockId, text]
      properties:
        blockId:
          type: string
        chunkKey:
          type: string
        text:
          type: string
        score:
          type: number
        source:
          type: string
        path:
          type: string
        heading:
          type: string
        pinned:
          type: boolean
          description: True when the chunk is a human-pinned override (Phase C4).
        humanOverride:
          type: boolean
          description: >
            True when the chunk is a human override (Phase C4; pins bypass the
            Phase F decision gate, never budgets).

    ContextDrop:
      type: object
      description: >
        One labeled truncation/drop record. Truncation is never silent
        (ADR-0044 §3, failure-semantics §4).
      required: [component, reason, count]
      properties:
        component:
          type: string
          enum: [history, rag, mention]
        reason:
          type: string
          description: >
            The labeled reason: `history-budget` | `rag-budget` |
            `mention-budget` | `excluded` | `not-found` | `context-window`.
        count:
          type: integer
        detail:
          type: string
        humanOverride:
          type: boolean
          description: >
            True when the dropped item was a human override (a pinned chunk
            dropped by truncation, Phase C4); labels the override in the
            snapshot.

    BudgetUsage:
      type: object
      description: Per-component budget utilization (used vs the PipelinePolicy limit).
      required: [component, used]
      properties:
        component:
          type: string
          enum: [system, tools, rag, history, mentions, user, thinking]
        used:
          type: integer
        limit:
          type: integer
          description: The PipelinePolicy limit for this component; 0/absent when none applies.

    ContextEvent:
      allOf:
        - $ref: '#/components/schemas/ContextSnapshot'

    LocateEvent:
      allOf:
        - $ref: '#/components/schemas/LocateResult'

    DoneEvent:
      type: object
      properties:
        degraded:
          type: boolean
        usedModel:
          type: string

    ErrorEvent:
      type: object
      properties:
        code:
          type: string
          description: >
            The typed terminal error code. Budget/window codes added by ADR-0051:
            `context-window-exceeded` (fixed + pinned + user alone exceed the
            model window, refused before any provider call) and
            `session-budget-exceeded` (the hard session budget would be crossed
            and compaction did not rescue the turn). `thinking-truncated` labels
            a `length` turn with neither a tool call nor an answer.
        message:
          type: string

    BackpressureEvent:
      type: object
      description: The subscriber queue overflowed; oldest events were dropped.
      properties: {}
